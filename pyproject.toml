[project]
name = "vidsense"
version = "0.1.0"
description = "Ask questions about a video and get answers with timestamps: Whisper + CLIP keyframes + DTW alignment + ChromaDB + LangChain."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vishnu Priya Taduka" }]
keywords = ["video", "rag", "whisper", "clip", "langchain", "multimodal"]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "av>=14.0",
    "faster-whisper>=1.1",
    "torch>=2.2",
    "transformers>=4.41",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "chromadb>=1.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langchain-openai>=0.2",
    "streamlit>=1.60",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/VP-TT/vidsense"
Documentation = "https://github.com/VP-TT/vidsense/blob/main/docs/ARCHITECTURE.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vidsense = "vidsense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidsense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that download models and process a real video"]
addopts = "-m 'not slow'"
